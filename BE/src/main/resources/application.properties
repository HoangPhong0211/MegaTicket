spring.application.name=megaticket

# Tự động đọc file .env nếu có ở local (không báo lỗi nếu không tồn tại)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:BE/.env[.properties]

# ===============================
# PostgreSQL Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:megaticket_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Redis Configuration
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===============================
# JWT Configuration
# ===============================
# Secret key phải dài ít nhất 256-bit (32 ký tự) cho HS256
app.jwt.secret=${JWT_SECRET:megaticket-super-secret-key-must-be-at-least-256-bits-long}
# Thời gian token hết hạn: 86400000ms = 24 giờ
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# VietQR / Payment Configuration
# ===============================
# Thông tin tài khoản ngân hàng nhận tiền
app.payment.bank-id=${BANK_ID:BIDV}
app.payment.account-number=${BANK_ACCOUNT_NUMBER:1234567890}
app.payment.account-name=${BANK_ACCOUNT_NAME:CONG TY MEGATICKET}

# ===============================
# Gemini AI Chatbot Configuration
# ===============================
# Lấy API key tại: https://aistudio.google.com/apikey (hỗ trợ cả GEMINI_API_KEY và GOOGLE_API_KEY)
app.gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
# gemini-3.5-flash-lite tối ưu tốc độ cao + hỗ trợ thinking_level=MINIMAL cho Chatbot CSKH
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.thinking-level=${GEMINI_THINKING_LEVEL:MINIMAL}
